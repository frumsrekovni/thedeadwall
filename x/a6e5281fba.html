<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
	<meta name="robots" content="noindex, nofollow, noarchive" />
	<meta name="referrer" content="no-referrer" />
	<title>The Dead Wall 2026 · A whisper in the dungeon</title>
	<meta name="theme-color" content="#06060a" />
	<link rel="icon" href="../files/coffinico.ico" />
	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
	<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&amp;display=swap" rel="stylesheet" />
	<link rel="stylesheet" href="../style.css" />
</head>
<body class="hunt-page">
	<main class="hunt">
		<p class="hunt-eyebrow">The Dead Wall 2026</p>
		<h1 class="hunt-question">How much is an open kokushi worth?</h1>
		<form class="panel form hunt-form" data-qid="open-kokushi" novalidate>
			<div class="field">
				<label for="hunt-name">Your name</label>
				<input id="hunt-name" name="name" type="text" maxlength="60" required autocomplete="name" />
			</div>
			<div class="field">
				<label for="hunt-answer">Your answer</label>
				<textarea id="hunt-answer" name="answer" rows="3" maxlength="500" required></textarea>
			</div>
			<button class="cta" type="submit">Send answer</button>
			<p class="reg-status hunt-status" role="status" aria-live="polite"></p>
		</form>
	</main>
	<script src="hunt.js" defer></script>
	<script src="../cosmos.js" defer></script>
</body>
</html>

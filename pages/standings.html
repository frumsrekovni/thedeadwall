<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<title>Standings · The Dead Wall 2026</title>
		<meta name="description" content="Live standings for The Dead Wall 2026." />
		<meta name="theme-color" content="#06060a" />
		<link rel="icon" href="../files/coffinico.ico" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&display=swap" rel="stylesheet" />
		<link rel="stylesheet" href="../style.css" />
	</head>
	<body>
		<nav class="subpage-nav">
			<a class="brand" href="../index.html">
				<img src="../files/deadwall-logo.gif" alt="" width="116" height="22" aria-hidden="true" />
				<span>The Dead Wall</span>
			</a>
			<a class="back" href="../index.html">← Home</a>
		</nav>

		<main class="subpage">
			<h1 class="subpage-title">Standings</h1>
			<p class="subpage-sub">The Dead Wall 2026</p>

			<div class="panel">
				<table class="standings">
					<thead>
						<tr>
							<th class="rank">#</th>
							<th>Name</th>
							<th>Total</th>
						</tr>
					</thead>
					<tbody id="rows"></tbody>
				</table>
				<p class="standings-status" id="status" role="status" aria-live="polite">Loading…</p>
			</div>
		</main>

		<script>
			(function () {
				var ENDPOINT =
					'https://script.google.com/macros/s/AKfycbw3QThA_WhI4gLjyUNTnmk8629ky3hZ3x_CoLY_4OmmmVvxHyjmunsRaJ9BjSS_Rvey/exec';
				var rows = document.getElementById('rows');
				var status = document.getElementById('status');
				var FIELDS = [
					['game1', 'Game 1'],
					['quiz', 'Quiz'],
					['game2', 'Game 2'],
					['costume', 'Costume'],
					['game3', 'Game 3'],
					['secret', 'Secret'],
					['total', 'Total'],
				];
				var expanded = {};
				var lastJson = '';

				function esc(s) {
					return String(s).replace(/[&<>"]/g, function (c) {
						return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
					});
				}
				function num(v) {
					return typeof v === 'number' && isFinite(v) ? v : null;
				}
				function fmt(v) {
					if (v === null) return '\u2013';
					return String(Math.round(v * 100) / 100);
				}

				function render(d) {
					var seen = {};
					var list = ((d && d.players) || []).map(function (p) {
						var o = { name: String(p.name) };
						seen[o.name] = (seen[o.name] || 0) + 1;
						o.key = o.name + '#' + seen[o.name];
						FIELDS.forEach(function (f) {
							o[f[0]] = num(p[f[0]]);
						});
						if (o.total === null) o.total = 0;
						return o;
					});
					var json = JSON.stringify(list);
					if (json === lastJson) return;
					lastJson = json;
					list.sort(function (a, b) {
						return b.total - a.total || a.name.localeCompare(b.name);
					});
					var rank = 0,
						prev = null;
					rows.innerHTML = list
						.map(function (p, i) {
							if (p.total !== prev) rank = i + 1;
							prev = p.total;
							var open = !!expanded[p.key];
							var detail = FIELDS.map(function (f) {
								var v = p[f[0]];
								var cls = 'stat' + (f[0] === 'total' ? ' total' : '');
								return (
									'<div class="' + cls + '"><dt>' + f[1] + '</dt><dd' +
									(v === null ? ' class="empty"' : '') + '>' + fmt(v) + '</dd></div>'
								);
							}).join('');
							return (
								'<tr class="player-row' + (rank <= 3 ? ' top' : '') + (open ? ' open' : '') +
								'" data-key="' + esc(p.key) + '"><td class="rank">' + rank +
								'</td><td><button class="player-btn" type="button" aria-expanded="' + open +
								'" aria-controls="detail-' + i + '"><span>' + esc(p.name) +
								'</span><span class="chev" aria-hidden="true"></span></button></td><td>' +
								fmt(p.total) + '</td></tr>' +
								'<tr class="detail-row" id="detail-' + i + '"' + (open ? '' : ' hidden') +
								'><td colspan="3"><dl class="detail-grid">' + detail + '</dl></td></tr>'
							);
						})
						.join('');
					status.textContent = list.length ? '' : 'No standings yet.';
				}

				rows.addEventListener('click', function (e) {
					var tr = e.target.closest('.player-row');
					if (!tr) return;
					var detail = tr.nextElementSibling;
					var open = detail.hidden;
					detail.hidden = !open;
					tr.classList.toggle('open', open);
					tr.querySelector('.player-btn').setAttribute('aria-expanded', open ? 'true' : 'false');
					if (open) expanded[tr.dataset.key] = true;
					else delete expanded[tr.dataset.key];
				});

				function load() {
					var cb = '__st_' + Math.random().toString(36).slice(2);
					var s = document.createElement('script');
					var timer = setTimeout(function () {
						cleanup();
						if (!rows.children.length) status.textContent = 'Couldn\u2019t load the standings right now.';
					}, 9000);
					function cleanup() {
						clearTimeout(timer);
						try {
							delete window[cb];
						} catch (e) {}
						s.remove();
					}
					window[cb] = function (d) {
						cleanup();
						render(d);
					};
					s.onerror = cleanup;
					s.src = ENDPOINT + '?standings=1&callback=' + cb;
					document.body.appendChild(s);
				}

				load();
				setInterval(load, 60000);
			})();
		</script>
		<script src="../cosmos.js" defer></script>
	</body>
</html>
